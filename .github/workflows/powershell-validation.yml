name: PowerShell validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse the script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\scripts\Get-WindowsRecoveryBaseline.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            throw "PowerShell parser errors found."
          }

      - name: Generate a baseline report
        shell: pwsh
        run: |
          .\scripts\Get-WindowsRecoveryBaseline.ps1 -OutputPath .\reports\baseline.json
          $report = Get-Content .\reports\baseline.json -Raw | ConvertFrom-Json
          if (-not $report.operating_system.caption) {
            throw "Expected operating system details in the report."
          }
